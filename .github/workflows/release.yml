name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test
      - name: Package
        run: make release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Limiar-*.zip build/Limiar-*.dmg \
            --title "Limiar ${GITHUB_REF_NAME#v}" --generate-notes
